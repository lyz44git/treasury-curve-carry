name: forward record

# Part C (design/forward_plan.md): weekly, apply the Part B rule to the curve as published that day.
on:
  schedule:
    - cron: "23 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-record
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests -q
      - name: Download, check and extend the record
        run: python3 scripts/05_forward.py
      - name: Commit the record if it changed
        run: |
          if [ -n "$(git status --porcelain -- forward/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add forward/
            git commit -m "Forward record: run of $(date -u +%Y-%m-%d)"
            git push
          else
            echo "record unchanged"
          fi
